# Builds the static site and publishes it to GitHub Pages on every push to main.
# The base path and site URL come from the Pages settings, so the same workflow works at
# https://<user>.github.io/<repo>/ and, once a custom domain is set, at the domain root.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Pages reports http:// until HTTPS is enforced; links in the sitemap and share
      # image should always use https://.
      - name: Build
        shell: bash
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: NEXT_PUBLIC_SITE_URL="${PAGES_ORIGIN/#http:/https:}" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
